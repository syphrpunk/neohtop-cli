name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: cli
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../neohtop-cli-${{ matrix.suffix }} .

      - name: Compress binary
        run: |
          tar czf neohtop-cli-${{ matrix.suffix }}.tar.gz neohtop-cli-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-${{ matrix.suffix }}
          path: neohtop-cli-${{ matrix.suffix }}.tar.gz

  build-macos:
    needs: [test]
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            suffix: macos-arm64
          - goarch: amd64
            suffix: macos-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: cli
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../neohtop-cli-${{ matrix.suffix }} .

      - name: Compress binary
        run: |
          tar czf neohtop-cli-${{ matrix.suffix }}.tar.gz neohtop-cli-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-${{ matrix.suffix }}
          path: neohtop-cli-${{ matrix.suffix }}.tar.gz

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: cli
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../neohtop-cli-windows-amd64.exe .

      - name: Compress binary
        shell: bash
        run: |
          7z a neohtop-cli-windows-amd64.zip neohtop-cli-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-windows-amd64
          path: neohtop-cli-windows-amd64.zip

  # TypeScript CLI (ts/) — standalone bun-compiled binaries.
  # Native compile per runner: bun canary can't download cross-targets.
  build-ts:
    needs: [test]
    strategy:
      matrix:
        include:
          # no macos-amd64 leg: GitHub retired Intel macOS runners
          - runner: macos-latest
            suffix: macos-arm64
          - runner: ubuntu-latest
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: Type-check and test
        working-directory: ts
        run: |
          bunx tsc --noEmit
          bun test

      - name: Compile standalone binary
        working-directory: ts
        run: bun build --compile --minify src/index.ts --outfile dist/neohtop-${{ matrix.suffix }}

      - name: Compress binary
        working-directory: ts/dist
        run: tar czf neohtop-${{ matrix.suffix }}.tar.gz neohtop-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-ts-${{ matrix.suffix }}
          path: ts/dist/neohtop-${{ matrix.suffix }}.tar.gz

  release:
    needs: [build-linux, build-macos, build-windows, build-ts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/neohtop-cli-linux-amd64.tar.gz
            artifacts/neohtop-cli-linux-arm64.tar.gz
            artifacts/neohtop-cli-macos-arm64.tar.gz
            artifacts/neohtop-cli-macos-amd64.tar.gz
            artifacts/neohtop-cli-windows-amd64.zip
            artifacts/neohtop-macos-arm64.tar.gz
            artifacts/neohtop-linux-amd64.tar.gz
            artifacts/neohtop-linux-arm64.tar.gz
            artifacts/checksums.txt
