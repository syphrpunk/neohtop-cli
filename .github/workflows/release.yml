name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: cli
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../neohtop-cli-${{ matrix.suffix }} .

      - name: Compress binary
        run: |
          tar czf neohtop-cli-${{ matrix.suffix }}.tar.gz neohtop-cli-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-${{ matrix.suffix }}
          path: neohtop-cli-${{ matrix.suffix }}.tar.gz

  build-macos:
    needs: [test]
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            suffix: macos-arm64
          - goarch: amd64
            suffix: macos-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: cli
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../neohtop-cli-${{ matrix.suffix }} .

      - name: Compress binary
        run: |
          tar czf neohtop-cli-${{ matrix.suffix }}.tar.gz neohtop-cli-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-${{ matrix.suffix }}
          path: neohtop-cli-${{ matrix.suffix }}.tar.gz

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: cli
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../neohtop-cli-windows-amd64.exe .

      - name: Compress binary
        shell: bash
        run: |
          7z a neohtop-cli-windows-amd64.zip neohtop-cli-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-windows-amd64
          path: neohtop-cli-windows-amd64.zip

  # TypeScript CLI (ts/) — standalone bun-compiled binaries.
  # Native compile per runner: bun canary can't download cross-targets.
  # Each leg also embeds incur's binary metadata (__INCUR_BINARY_*) and
  # uploads a `neohtop-<incur-target>.gz` asset — the exact name+format
  # incur's `--update` GitHub provider looks for (gzip of the raw binary).
  build-ts:
    needs: [test]
    strategy:
      matrix:
        include:
          # no macos-amd64 leg: GitHub retired Intel macOS runners
          - runner: macos-latest
            suffix: macos-arm64
            incur_target: darwin-arm64
            exe: ""
          - runner: ubuntu-latest
            suffix: linux-amd64
            incur_target: linux-x64-glibc-baseline
            exe: ""
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
            incur_target: linux-arm64-glibc
            exe: ""
          - runner: windows-latest
            suffix: windows-amd64
            incur_target: windows-x64-baseline
            exe: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: Type-check and test
        working-directory: ts
        run: |
          bunx tsc --noEmit
          bun test

      - name: Compile standalone binary
        working-directory: ts
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          bun build --compile --minify src/index.ts \
            --outfile "dist/neohtop-${{ matrix.suffix }}${{ matrix.exe }}" \
            --define "__INCUR_BINARY_NAME__=\"neohtop\"" \
            --define "__INCUR_BINARY_TARGET__=\"${{ matrix.incur_target }}\"" \
            --define "__INCUR_BINARY_VERSION__=\"${VERSION}\""

      - name: Compress binary
        working-directory: ts/dist
        shell: bash
        run: |
          tar czf neohtop-${{ matrix.suffix }}.tar.gz neohtop-${{ matrix.suffix }}${{ matrix.exe }}
          # self-update asset: gzip of the raw binary, incur canonical name
          gzip -9 -c neohtop-${{ matrix.suffix }}${{ matrix.exe }} > neohtop-${{ matrix.incur_target }}${{ matrix.exe }}.gz

      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-ts-${{ matrix.suffix }}
          path: |
            ts/dist/neohtop-${{ matrix.suffix }}.tar.gz
            ts/dist/neohtop-${{ matrix.incur_target }}${{ matrix.exe }}.gz

  release:
    needs: [build-linux, build-macos, build-windows, build-ts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum neohtop* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/neohtop-cli-linux-amd64.tar.gz
            artifacts/neohtop-cli-linux-arm64.tar.gz
            artifacts/neohtop-cli-macos-arm64.tar.gz
            artifacts/neohtop-cli-macos-amd64.tar.gz
            artifacts/neohtop-cli-windows-amd64.zip
            artifacts/neohtop-macos-arm64.tar.gz
            artifacts/neohtop-linux-amd64.tar.gz
            artifacts/neohtop-linux-arm64.tar.gz
            artifacts/neohtop-windows-amd64.tar.gz
            artifacts/neohtop-darwin-arm64.gz
            artifacts/neohtop-linux-x64-glibc-baseline.gz
            artifacts/neohtop-linux-arm64-glibc.gz
            artifacts/neohtop-windows-x64-baseline.exe.gz
            artifacts/checksums.txt
