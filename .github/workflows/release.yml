name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  # TypeScript CLI (ts/) — standalone bun-compiled binaries.
  # Native compile per runner: bun canary can't download cross-targets.
  # Each leg also embeds incur's binary metadata (__INCUR_BINARY_*) and
  # uploads a `sloppytop-<incur-target>.gz` asset — the exact name+format
  # incur's `--update` GitHub provider looks for (gzip of the raw binary).
  build-ts:
    needs: [test]
    strategy:
      matrix:
        include:
          # no macos-amd64 leg: GitHub retired Intel macOS runners
          - runner: macos-latest
            suffix: macos-arm64
            incur_target: darwin-arm64
            exe: ""
          - runner: ubuntu-latest
            suffix: linux-amd64
            incur_target: linux-x64-glibc-baseline
            exe: ""
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64
            incur_target: linux-arm64-glibc
            exe: ""
          - runner: windows-latest
            suffix: windows-amd64
            incur_target: windows-x64-baseline
            exe: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: Type-check and test
        working-directory: ts
        run: |
          bunx tsc --noEmit
          bun test

      - name: Compile standalone binary
        working-directory: ts
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          bun build --compile --minify src/index.ts \
            --outfile "dist/sloppytop-${{ matrix.suffix }}${{ matrix.exe }}" \
            --define "__INCUR_BINARY_NAME__=\"sloppytop\"" \
            --define "__INCUR_BINARY_TARGET__=\"${{ matrix.incur_target }}\"" \
            --define "__INCUR_BINARY_VERSION__=\"${VERSION}\""

      - name: Smoke help
        working-directory: ts
        shell: bash
        run: |
          bin="./dist/sloppytop-${{ matrix.suffix }}${{ matrix.exe }}"
          "$bin" --help
          "$bin" --help | grep -F "process monitor screen"

      - name: Screen starts
        if: matrix.suffix != 'windows-amd64'
        working-directory: ts
        shell: bash
        run: python3 smoke-tui.py "./dist/sloppytop-${{ matrix.suffix }}"

      - name: Compress binary
        working-directory: ts/dist
        shell: bash
        run: |
          tar czf sloppytop-${{ matrix.suffix }}.tar.gz sloppytop-${{ matrix.suffix }}${{ matrix.exe }}
          # self-update asset: gzip of the raw binary, incur canonical name
          gzip -9 -c sloppytop-${{ matrix.suffix }}${{ matrix.exe }} > sloppytop-${{ matrix.incur_target }}${{ matrix.exe }}.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sloppytop-ts-${{ matrix.suffix }}
          path: |
            ts/dist/sloppytop-${{ matrix.suffix }}.tar.gz
            ts/dist/sloppytop-${{ matrix.incur_target }}${{ matrix.exe }}.gz

  release:
    needs: [build-ts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum sloppytop* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/sloppytop-macos-arm64.tar.gz
            artifacts/sloppytop-linux-amd64.tar.gz
            artifacts/sloppytop-linux-arm64.tar.gz
            artifacts/sloppytop-windows-amd64.tar.gz
            artifacts/sloppytop-darwin-arm64.gz
            artifacts/sloppytop-linux-x64-glibc-baseline.gz
            artifacts/sloppytop-linux-arm64-glibc.gz
            artifacts/sloppytop-windows-x64-baseline.exe.gz
            artifacts/checksums.txt
