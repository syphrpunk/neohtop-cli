name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...
      - name: Build binary
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.sha }}" -o ../neohtop-cli .
      - name: Smoke
        run: ./neohtop-cli --help
      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-cli-linux-amd64
          path: neohtop-cli

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install dependencies
        working-directory: ts
        run: bun install --frozen-lockfile
      - name: Type-check and test
        working-directory: ts
        run: |
          bunx tsc --noEmit
          bun test
      - name: Compile standalone binary
        working-directory: ts
        run: |
          bun build --compile --minify src/index.ts \
            --outfile dist/neohtop \
            --define "__INCUR_BINARY_NAME__=\"neohtop\"" \
            --define "__INCUR_BINARY_TARGET__=\"linux-x64-glibc-baseline\"" \
            --define "__INCUR_BINARY_VERSION__=\"ci\""
      - name: Smoke
        working-directory: ts
        run: ./dist/neohtop --help
      - uses: actions/upload-artifact@v4
        with:
          name: neohtop-linux-amd64
          path: ts/dist/neohtop
